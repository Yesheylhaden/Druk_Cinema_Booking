name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ciLocalPassword
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - run: RUN_INTEGRATION=1 node --test tests/integration.test.js
      - if: always()
        run: docker compose down
