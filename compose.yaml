services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: druk_cinema
      POSTGRES_USER: druk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - cinema-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U druk -d druk_cinema"]
      interval: 5s
      timeout: 5s
      retries: 10
  catalog:
    build:
      context: .
      dockerfile: Dockerfile.service
    environment:
      DATABASE_URL: postgresql://druk:${POSTGRES_PASSWORD}@postgres:5432/druk_cinema
    ports: ["127.0.0.1:4001:4001"]
    depends_on:
      postgres:
        condition: service_healthy
  bookings:
    build:
      context: .
      dockerfile: Dockerfile.service
    command: ["node","services/bookings/src/server.js"]
    environment:
      DATABASE_URL: postgresql://druk:${POSTGRES_PASSWORD}@postgres:5432/druk_cinema
      CATALOG_URL: http://catalog:4001
      AUTH_URL: http://auth:4003
      DEMO_PAYMENTS: ${DEMO_PAYMENTS:-false}
      NODE_ENV: ${NODE_ENV:-development}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports: ["127.0.0.1:4002:4002"]
    depends_on:
      postgres:
        condition: service_healthy
  auth:
    build:
      context: .
      dockerfile: Dockerfile.service
    command: ["node","services/auth/src/server.js"]
    environment:
      DATABASE_URL: postgresql://druk:${POSTGRES_PASSWORD}@postgres:5432/druk_cinema
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports: ["127.0.0.1:4003:4003"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  cinema-data:
